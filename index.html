</head>
<body>

         <div class="container">

    <style> 

     *, *::before, *::after{
                box-sizing: border-box;
                margin: 0;
            }




             
            
            body{
            margin:0;
            width: 100%;
            overflow-x: hidden;
            height: 100vh;
            justify-content: center;
            display: flex;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container p{
            font-weight: bold;
            font-size: 14px;
        }
        .container input{
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
            margin-top: 5px;
            margin-bottom: 7px;
            
        }

        .button{
    background-color: #007bff;
     border-radius: 5px;
     border:none;
     width: 100%;
     padding: 10px;
     color: white;
     margin-top: 10px;
     cursor: pointer;
        }

        .button:hover{
             background-color: black;
        }

        .container{
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-radius: 5px;
            padding: 30px;
            width: 100%;
            margin-top: 5px;
        

        }

        .end{

            text-align: center;

            justify-content: center ;

        }

        .check{
             display: flex;
            margin-top: 10px;

            justify-content: space-between;

        }
        .end a:hover{
