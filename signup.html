<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
</head>
<body>
    <form action="index.html">
        
         <div class="container">
        <h1 style="text-align: center;">Create Account</h1>
        <p style="color: gray;
        text-align: center;
        margin-top: 5px;
        font-weight: lighter;
        margin-bottom: 10px;"> Sign up to get started</p>

    <p> Full Name</p>  
    <input type="text" placeholder="Enter your full name">  
    <p> Email</p>
    <input type="text" placeholder="Enter Email"> 
    <p> Password</p>
    <input type="password" placeholder="Enter Password">  
     <span class="eye"> </span>
     <p> Confirm Password</p>
     <input type="password" placeholder="Confirm Password" > 
     
     <button type="submit"   class="button"> Create Account</button>
    <div class="end">
     <p style=" color:gray; font-weight: lighter;"> Already have an account?</p>
     <a href="index.html" style="color: blue;
     text-decoration: none;"> Login</a>
     </div>
     </div>
     </form>

     

    <style> 

     *, *::before, *::after{
                box-sizing: border-box;
                margin: 0;
            }




             
            
            body{
            margin:0;
            width: 100%;
            overflow-x: hidden;
            height: 100vh;
            justify-content: center;
            display: flex;
            font-family: Arial, Helvetica, sans-serif;
                align-items: center;
        }

        .end a:hover{
            background-color: lightblue;
            
        }

        .container p{
            font-weight: bold;
            font-size: 14px;
        }
        .container input{
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
            margin-top: 5px;
            margin-bottom: 7px;
            
        }

        .button{
    background-color: #007bff;
     border-radius: 5px;
     border:none;
     width: 100%;
     padding: 10px;
     color: white;
     margin-top: 10px;
     cursor: pointer;
        }

        .button:hover{
             background-color: black;
        }

        .container{
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-radius: 5px;
            padding: 30px;
            width: 100%;
            margin-top: 5px;
        

        }

        .end{
            display: flex;
            justify-content: center;
            margin-top: 10px;
            gap: 5px;
            
        }

        

        


    </style>
    


    






</body>
</html>
